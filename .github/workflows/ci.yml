name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python examples/make_dataset.py
      - run: python scripts/license_inventory.py --python
      - run: python -m pytest -q
      - run: python -m pactmesh demo

  escrow-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path contracts/escrow/Cargo.toml
      - run: cargo build --manifest-path contracts/escrow/Cargo.toml --features localnet --bin pactmesh-localnet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_solana_localnet.py tests/test_solana_escrow.py
      - run: python -m pactmesh demo --chain localnet
      - run: python scripts/license_inventory.py
