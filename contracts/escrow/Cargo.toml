[package]
name = "cripito-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cripito test escrow: native SOL held by a PDA keyed by the agreement hash"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Host-only JSON-RPC emulator that runs this program's processor (not a validator).
localnet = ["dep:serde_json", "dep:base64", "dep:ed25519-dalek"]

[dependencies]
solana-program = "2.2"
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2", optional = true }

[[bin]]
name = "cripito-localnet"
path = "src/bin/localnet.rs"
required-features = ["localnet"]

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
